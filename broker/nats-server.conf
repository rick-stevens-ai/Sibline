# Sibline NATS broker config — REFERENCE
#
# This config powers the canonical Sibline broker on the M1 mini.
# Copy this to your own machine, replace placeholders, and run via your
# preferred service manager (launchd on macOS, systemd on Linux).
#
# Subjects are tailnet-bound (not 0.0.0.0) — sibling traffic stays on the
# private overlay. Adjust `listen` to your tailnet/private IP.

# REPLACE with your tailnet/private IP — never bind 0.0.0.0 for sibling traffic.
listen: "YOUR_PRIVATE_IP:4222"

# Monitoring endpoint (localhost only). Useful for `curl :8222/varz`.
http: "127.0.0.1:8222"

server_name: "sibline-broker"

jetstream {
  # REPLACE with your absolute path.
  store_dir: "/var/lib/sibline/jetstream"
  max_memory_store: 256MB
  # Size for the whole fleet. JetStream reserves nothing per-stream when streams
  # use max_bytes=-1 (see broker/provision-streams.sh), but a new stream still
  # cannot be created once the SUM of per-stream reservations would exceed this
  # ceiling (err 10047 "insufficient storage resources available"). With N
  # agents this must comfortably exceed N * (expected per-stream footprint).
  # 10GB fits a ~10-agent mesh with headroom; actual on-disk use stays tiny.
  max_file_store: 10GB
}

# Two sibling users + one admin.
# Generate strong passwords (32+ chars) per machine; do NOT commit real ones.
#   python3 -c "import secrets,string; print(''.join(secrets.choice(string.ascii_letters+string.digits) for _ in range(32)))"
authorization {
  users = [
    {
      user: admin
      password: "REPLACE_ADMIN_PASSWORD"
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
    {
      user: kukla
      password: "REPLACE_SIBLING_PASSWORD"
      permissions: {
        publish:   { allow: ["sibline.>", "_INBOX.>", "$JS.>"] }
        subscribe: { allow: ["sibline.>", "_INBOX.>"] }
      }
    }
    {
      user: ollie
      password: "REPLACE_SIBLING_PASSWORD"
      permissions: {
        publish:   { allow: ["sibline.>", "_INBOX.>", "$JS.>"] }
        subscribe: { allow: ["sibline.>", "_INBOX.>"] }
      }
    }
  ]
}

# REPLACE with your absolute log path.
log_file: "/var/log/sibline/nats.log"
logtime: true
debug: false
trace: false
